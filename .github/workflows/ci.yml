name: LeeTKOB CI Quality Gate

on:
  push:
    branches: [ main ]
    tags: [ 'pa2' ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Lint, Format, Typecheck, and Contract Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leetkob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: backend
        run: npm install

      - name: Run Prisma Migrations and Seed Test Database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leetkob_test?schema=public
        run: |
          npx prisma db push
          npx prisma db seed

      - name: 1. Lint Check
        working-directory: backend
        run: npm run lint

      - name: 2. Formatting Check
        working-directory: backend
        run: npm run format:check

      - name: 3. Static Type Check
        working-directory: backend
        run: npm run typecheck

      - name: 4. Contract Tests Execution
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leetkob_test?schema=public
          NODE_ENV: test
        run: npm test

